name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token needed.
# Runs when a version tag (v*) is pushed, or on manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Test (gate the release)
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    # Matches the Environment name set in the PyPI pending-publisher config.
    environment:
      name: pypi
      url: https://pypi.org/p/apitor-ble
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
